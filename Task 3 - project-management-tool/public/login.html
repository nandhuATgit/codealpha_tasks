<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Project Management Tool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">P</div>
        <span>ProjectMaster</span>
      </a>
      <div class="nav-links">
        <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Card Section -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your projects and collaborate with your team</p>
      </div>

      <!-- Alert Box -->
      <div id="loginAlert" class="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="credential" class="form-label">Email or Username</label>
          <input
            type="text"
            id="credential"
            class="form-control"
            placeholder="e.g. alex or alex@example.com"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Sign up here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 ProjectMaster. Built for CodeAlpha Internship Task 3.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
