<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Project Management Tool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">P</div>
        <span>ProjectMaster</span>
      </a>
      <div class="nav-links">
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Card Section -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Get started with your collaborative project management workspace</p>
      </div>

      <!-- Alert Box -->
      <div id="registerAlert" class="alert"></div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="e.g. Alex Johnson"
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="e.g. alexj"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="e.g. alex@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="At least 6 characters"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Re-enter password"
            required
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Register &amp; Get Started
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 ProjectMaster. Built for CodeAlpha Internship Task 3.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
