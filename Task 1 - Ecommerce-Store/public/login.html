<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CollegeStore</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="/index.html">🛒 CollegeStore</a>
    </div>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/product.html">Products</a></li>
      <li><a href="/cart.html">Cart <span class="cart-badge">0</span></a></li>
      <li><a href="/login.html" class="active">Login</a></li>
      <li><a href="/register.html" class="btn btn-primary" style="color: white;">Register</a></li>
    </ul>
  </header>

  <!-- Login Form Container -->
  <main class="container">
    <div class="auth-box">
      <h2>Account Login</h2>

      <!-- Feedback Alert Box -->
      <div id="auth-alert" class="alert-box" style="display: none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="student@college.edu" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        <div class="form-footer">
          Don't have an account? <a href="/register.html">Register here</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 CollegeStore Project. Built with Node.js, Express, and MongoDB.</p>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
