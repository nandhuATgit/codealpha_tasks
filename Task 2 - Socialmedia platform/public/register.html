<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - SocialMedia</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="nav-brand">
        <a href="/index.html" class="nav-logo">
          <span class="logo-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/>
              <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
            </svg>
          </span>
          <span class="logo-text">SocialMedia</span>
        </a>
      </div>
      <nav id="navbar">
        <!-- Populated by app.js -->
      </nav>
    </header>

    <div class="page-wrapper">
      <main>
        <div class="card-header">
          <h2>Create an Account</h2>
          <p class="card-subtitle">Join SocialMedia to share updates, connect with friends, and participate in discussions</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="e.g. Jane Doe"
              required
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="e.g. janedoe"
              required
              autocomplete="username"
            />
            <div class="form-hint">Letters, numbers, and underscores (3-30 characters)</div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 6 characters"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              required
              autocomplete="new-password"
            />
          </div>

          <button type="submit" id="submitBtn" class="btn">Register</button>
        </form>

        <div class="form-footer">
          Already have an account? <a href="/login.html">Log in here</a>
        </div>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
