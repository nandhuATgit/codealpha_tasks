<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post - SocialMedia</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="nav-brand">
        <a href="/index.html" class="nav-logo">
          <span class="logo-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/>
              <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
            </svg>
          </span>
          <span class="logo-text">SocialMedia</span>
        </a>
      </div>
      <nav id="navbar">
        <!-- Populated by app.js -->
      </nav>
    </header>

    <div class="page-wrapper">
      <main style="max-width: 560px;">
        <div class="card-header" style="text-align: left; margin-bottom: 20px;">
          <h2>Create a Post</h2>
          <p class="card-subtitle">Share what's on your mind with the community</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="createPostForm" novalidate>
          <div class="form-group">
            <label for="content">What's on your mind?</label>
            <textarea
              id="content"
              name="content"
              rows="5"
              placeholder="Write your update or story..."
              required
              maxlength="1000"
            ></textarea>
            <div class="form-hint">Maximum 1,000 characters</div>
          </div>

          <div class="form-group">
            <label for="image">Image URL (Optional)</label>
            <input
              type="url"
              id="image"
              name="image"
              placeholder="https://example.com/image.jpg"
            />
            <div class="form-hint">Provide a direct link to any public image</div>
          </div>

          <div class="form-actions-bar">
            <button type="submit" id="submitPostBtn" class="btn">Publish Post</button>
            <a href="/index.html" class="btn btn-secondary btn-cancel">Cancel</a>
          </div>
        </form>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/post.js"></script>
  </body>
</html>
