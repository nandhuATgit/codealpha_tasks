<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - SocialMedia</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="nav-brand">
        <a href="/index.html" class="nav-logo">
          <span class="logo-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/>
              <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
            </svg>
          </span>
          <span class="logo-text">SocialMedia</span>
        </a>
      </div>
      <nav id="navbar">
        <!-- Populated by app.js -->
      </nav>
    </header>

    <div class="page-wrapper">
      <div class="profile-card">
        <!-- Cover Banner -->
        <div class="profile-cover-banner"></div>

        <div class="profile-card-content">
          <div id="alertBox" class="alert"></div>

          <!-- Top Row: Avatar on left, Actions on right -->
          <div class="profile-top-row">
            <div class="profile-avatar-container">
              <img
                id="profileImage"
                class="profile-avatar"
                src="https://via.placeholder.com/96?text=User"
                alt="Profile Avatar"
              />
            </div>
            <div class="profile-actions-wrapper">
              <!-- Owner Actions -->
              <div id="ownerActions" class="profile-actions" style="display: none;">
                <button id="toggleEditBtn" class="btn btn-secondary">Edit Profile</button>
              </div>

              <!-- Follow Actions (For other users' profiles) -->
              <div id="followActions" class="profile-actions" style="display: none;">
                <button id="followBtn" class="btn">Follow</button>
              </div>
            </div>
          </div>

          <!-- User Details (Cleanly positioned on white card background) -->
          <div class="profile-info">
            <h2 id="displayName" class="profile-name">User Name</h2>
            <p id="displayUsername" class="profile-username">@username</p>
            <p id="displayBio" class="profile-bio">No bio provided yet.</p>
          </div>

          <!-- Stats Bar -->
          <div class="profile-stats">
            <div class="stat-item">
              <div id="postsCount" class="stat-value">0</div>
              <div class="stat-label">Posts</div>
            </div>
            <div class="stat-item">
              <div id="followersCount" class="stat-value">0</div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat-item">
              <div id="followingCount" class="stat-value">0</div>
              <div class="stat-label">Following</div>
            </div>
          </div>

          <!-- Edit Profile Form -->
          <div id="editProfileSection" class="edit-profile-section">
            <h3>Edit Profile Details</h3>
            <form id="editProfileForm">
              <div class="form-group">
                <label for="editName">Full Name</label>
                <input type="text" id="editName" name="name" required />
              </div>

              <div class="form-group">
                <label for="editBio">Bio (Max 160 characters)</label>
                <textarea
                  id="editBio"
                  name="bio"
                  rows="3"
                  maxlength="160"
                  placeholder="Tell others about yourself..."
                ></textarea>
              </div>

              <div class="form-group">
                <label for="editProfileImage">Profile Image URL</label>
                <input
                  type="url"
                  id="editProfileImage"
                  name="profileImage"
                  placeholder="https://example.com/avatar.jpg"
                />
              </div>

              <div class="edit-actions">
                <button type="submit" id="saveProfileBtn" class="btn">Save Changes</button>
                <button type="button" id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
              </div>
            </form>
          </div>

          <!-- User's Posts Section -->
          <div class="profile-posts-section">
            <h3 class="profile-section-title">Posts</h3>
            <div id="userPostsFeed">
              <div class="empty-feed-msg">
                <span class="spinner"></span>
                <p>Loading posts...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/profile.js"></script>
  </body>
</html>
